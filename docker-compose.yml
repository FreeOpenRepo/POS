services:
  pos-api:
    build:
      context: ./pos-api
      dockerfile: Dockerfile
    container_name: pos-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    restart: unless-stopped
    networks:
      - pos-network

  pos-web:
    build:
      context: ./pos-web
      dockerfile: Dockerfile
    container_name: pos-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - pos-api
    restart: unless-stopped
    networks:
      - pos-network

networks:
  pos-network:
    driver: bridge
