services:
  pos-db:
    image: postgres:18-alpine
    container_name: pos-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pos_db
    ports:
      - "5432:5432"
    volumes:
      - pos_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "pos_db"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - pos-network

  pos-api:
    build:
      context: ./pos-api
      dockerfile: Dockerfile
    container_name: pos-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__PostgresConnection=Host=pos-db;Port=5432;Database=pos_db;Username=postgres;Password=postgres
    depends_on:
      pos-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pos-network

  pos-web:
    build:
      context: ./pos-web
      dockerfile: Dockerfile
    container_name: pos-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - pos-api
    restart: unless-stopped
    networks:
      - pos-network

volumes:
  pos_postgres_data:

networks:
  pos-network:
    driver: bridge


